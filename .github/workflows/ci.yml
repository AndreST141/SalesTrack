name: SalesTrack CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend Tests & Coverage
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend – Python/Flask Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: salestrack_test
          MYSQL_USER: salestrack
          MYSQL_PASSWORD: salestrack123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root --password=rootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: salestrack_test
      DB_USER: salestrack
      DB_PASSWORD: salestrack123
      JWT_SECRET: ci-test-secret-key-for-github-actions
      TECNICO_SECRET: ""
      FLASK_ENV: testing

    defaults:
      run:
        working-directory: BACKEND/backend_api-rest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BACKEND/backend_api-rest/requirements*.txt

      - name: Instalar dependências de produção
        run: pip install -r requirements.txt

      - name: Instalar dependências de desenvolvimento/testes
        run: pip install -r requirements-dev.txt

      - name: Aguardar MySQL estar pronto
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u salestrack --password=salestrack123 --silent 2>/dev/null; then
              echo "MySQL pronto!"
              break
            fi
            echo "Aguardando MySQL... ($i/30)"
            sleep 2
          done

      - name: Inicializar schema do banco no MySQL
        run: |
          mysql -h 127.0.0.1 -u salestrack --password=salestrack123 salestrack_test < ../database/database_setup.sql

      - name: Executar testes do backend com cobertura
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov=middlewares \
            --cov=routes \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage_html \
            -v \
            --tb=short

      - name: Upload relatório de cobertura (XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: BACKEND/backend_api-rest/coverage.xml
          retention-days: 30

      - name: Upload HTML de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-html
          path: BACKEND/backend_api-rest/coverage_html/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2: Frontend Tests & Build
  # ─────────────────────────────────────────────
  frontend-tests:
    name: Frontend – Vitest & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FRONTEND/frontend_react

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FRONTEND/frontend_react/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes do frontend com cobertura
        run: npm run test:coverage

      - name: Build de produção do frontend
        run: npm run build

      - name: Upload relatório de cobertura frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: FRONTEND/frontend_react/coverage/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3: Linting e Padronização
  # ─────────────────────────────────────────────
  lint:
    name: Frontend – ESLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FRONTEND/frontend_react

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FRONTEND/frontend_react/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  # ─────────────────────────────────────────────
  # JOB 4: Validar Docker Compose (sintaxe)
  # ─────────────────────────────────────────────
  validate-docker:
    name: Validar configuração Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar sintaxe do docker-compose.yml
        run: docker compose config --quiet
        env:
          TECNICO_SECRET: ci-dummy
          JWT_SECRET: ci-test-secret-key-for-github-actions

  # ─────────────────────────────────────────────
  # JOB 5: Status Check (gate único)
  # ─────────────────────────────────────────────
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, lint, validate-docker]
    if: always()

    steps:
      - name: Verificar se os jobs críticos passaram
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "FALHA: backend-tests falhou!"
            exit 1
          fi
          if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
            echo "FALHA: frontend-tests falhou!"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "FALHA: lint falhou!"
            exit 1
          fi
          if [[ "${{ needs.validate-docker.result }}" != "success" ]]; then
            echo "FALHA: validate-docker falhou!"
            exit 1
          fi
          echo "Todos os jobs críticos de CI passaram com sucesso!"
