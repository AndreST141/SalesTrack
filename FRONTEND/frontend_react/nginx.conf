server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca pode ficar em cache: é ele que aponta para os arquivos
    # JS/CSS com hash de cada build. Se o navegador guardar uma cópia antiga,
    # continua carregando a versão anterior do app mesmo depois de um novo
    # deploy (foi a causa de configurações "sumirem" após atualizações).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Os arquivos dentro de /assets/ têm hash no nome (ex: index-93tCW5-t.js),
    # então um novo build sempre gera nomes novos — podem ficar em cache
    # por muito tempo sem risco de servir conteúdo desatualizado.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
